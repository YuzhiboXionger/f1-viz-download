# 把本仓库（f1-viz-download 站点文件）发布到 GitHub Pages
# 触发：推送到 main，也可手动触发
# 需在仓库 Settings → Pages → Source 选择「GitHub Actions」
name: Deploy download page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 并发部署：同组新提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # 站点文件就在仓库根

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
